<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>mapa</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #mapa { position: relative; width: 100%; }
  #mapa canvas { border-radius: 12px; }
  /* Os dois botões de zoom, no lugar onde o controle do MapLibre ficava. */
  .zoom {
    position: absolute; top: 12px; left: 12px; z-index: 2;
    display: flex; flex-direction: column; gap: 1px;
    border-radius: 6px; overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .zoom button {
    width: 30px; height: 30px; border: 0; background: #fff; color: #333;
    font-size: 18px; line-height: 1; cursor: pointer;
  }
  .zoom button:hover { background: #f2f2f2; }
  .zoom button:active { background: #e6e6e6; }
  .tooltip {
    position: absolute; z-index: 3; pointer-events: none;
    transform: translate(12px, 12px);
    max-width: 280px;
  }
</style>
</head>
<body>
<div id="mapa">
  <div class="zoom" aria-label="Zoom">
    <button type="button" id="mais" title="Aproximar">+</button>
    <button type="button" id="menos" title="Afastar">−</button>
  </div>
</div>
<script src="deck.min.js"></script>
<script src="deck-json.min.js"></script>
<script src="mapa.js"></script>
</body>
</html>
