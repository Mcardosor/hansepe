<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>mapa</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #mapa { position: relative; width: 100%; }
  #mapa canvas { border-radius: 12px; }
  /* Os dois botões de zoom, no lugar onde o controle do MapLibre ficava. */
  .zoom {
    position: absolute; top: 12px; left: 12px; z-index: 2;
    display: flex; flex-direction: column; gap: 1px;
    border-radius: 6px; overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .zoom button {
    width: 30px; height: 30px; border: 0; background: #fff; color: #333;
    font-size: 18px; line-height: 1; cursor: pointer;
  }
  .zoom button:hover { background: #f2f2f2; }
  .zoom button:active { background: #e6e6e6; }
  /* O balão fica sempre à **esquerda** do ponteiro.

     O deck o põe à direita e pronto, e aí ele saía pela borda do iframe, que
     tem `overflow:hidden` — em Fernando de Noronha, no canto superior
     direito, sobrava metade do texto.

     Tentei primeiro medir a caixa e virar para o lado que coubesse. Ficou
     pior: a medida só existe depois que o deck escreve a posição, então o
     balão aparecia num lugar e pulava para outro a cada movimento do mouse —
     piscava. Posição fixa não pisca porque não depende de medir nada.

     A regra dizia `.tooltip` até 02/out/2026, e o deck nomeia o elemento
     `deck-tooltip`: não casava com nada, e era por isso que o balão nem
     largura máxima tinha. */
  .deck-tooltip {
    position: absolute; z-index: 3; pointer-events: none;
    transform: translate(calc(-100% - 14px), 12px);
    max-width: 280px;
  }
</style>
</head>
<body>
<div id="mapa">
  <div class="zoom" aria-label="Zoom">
    <button type="button" id="mais" title="Aproximar">+</button>
    <button type="button" id="menos" title="Afastar">−</button>
  </div>
</div>
<script src="deck.min.js?v=ea54e246"></script>
<script src="deck-json.min.js?v=d55dc91a"></script>
<script src="mapa.js?v=7dbd8b03"></script>
</body>
</html>
