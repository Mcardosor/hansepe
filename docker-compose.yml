# Painel de hanseníase de Pernambuco — `hansepe`.
#
# Hospedagem nossa, na VM (`/cenarios/hansepe/`), como o sinan e o tbpe. Os
# dados são **do painel**: `./data`, com as partições de hanseníase e mais
# nada, montado somente leitura. Até 29/set/2026 era o lago inteiro do painel
# nacional (241 MB, cinco doenças), e o painel dependia de o sinan estar na
# mesma máquina. Montar a pasta própria é o que torna a entrega independente.
# Gerar com `python -m scripts.extrair_dados_hanseniase`.
services:
  dashboard:
    build: .
    image: hansepe:latest
    container_name: hansepe
    restart: unless-stopped
    ports:
      # 8507 sinan, 8508 demografico-longevidade, 8509 dftb; 8510 é a próxima.
      - 8510:8501
    environment:
      - PYTHONUNBUFFERED=1
      - SINAN_DATA_DIR=/app/data
      - SINAN_DOENCA=hanseniase
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    volumes:
      # Código montado do repositório: `git pull` + restart aplica mudança sem
      # rebuild. A imagem já tem uma cópia, então o container sobe mesmo se o
      # volume faltar.
      - ./app.py:/app/app.py:ro
      - ./src:/app/src:ro
      - ./.streamlit:/app/.streamlit:ro
      # A extração de hanseníase deste painel, somente leitura. `DADOS`
      # existe para quem quiser apontar para outro lugar; o padrão é a pasta
      # do próprio repositório.
      - ${DADOS:-./data}:/app/data:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1500M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8501/cenarios/hansepe/_stcore/health]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
